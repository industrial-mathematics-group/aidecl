# Publishes aisignoff to PyPI when a GitHub release is published (tag vX.Y.Z).
# Uses PyPI trusted publishing: no API token is stored here. PyPI must list this
# repository, this workflow file (publish.yml) and the environment "pypi" as a trusted
# publisher of the project "aisignoff".
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match version $VERSION in pyproject.toml (expected v$VERSION)." >&2
            exit 1
          fi
      - name: Test
        run: |
          pip install -e . pytest
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aisignoff/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
