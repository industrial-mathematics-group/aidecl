[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidecl"
version = "0.2.0"
description = "Declare and check AI generation (G0-G3), human review (H0-H3) and AI review (A-, A0-A3) per file, REUSE-style."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Industrial Mathematics Group" }]
dependencies = []

[project.scripts]
aidecl = "aidecl.cli:main"

[project.urls]
Homepage = "https://github.com/industrial-mathematics-group/aidecl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
