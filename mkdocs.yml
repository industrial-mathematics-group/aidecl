site_name: aisignoff
site_description: Sign off on AI use per file — declare and check AI generation, human review and AI review.
site_url: https://industrial-mathematics-group.github.io/aisignoff/
repo_url: https://github.com/industrial-mathematics-group/aisignoff
repo_name: industrial-mathematics-group/aisignoff
edit_uri: edit/main/docs/
copyright: MIT License · Industrial Mathematics Group

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - SIGNOFF.toml: signoff-toml.md
  - Inline tags: inline-tags.md
  - Commands: commands.md
  - CI and badges: ci.md
  - Migrating: migrating.md
  - Development: development.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  links:
    anchors: warn

exclude_docs: |
  requirements.txt
